# SAR Narrative Generator — neutral "pro tool" theme
# Near-monochrome greys on the requested #262626 base, white primary actions,
# desaturated status colours. Mirrors the tokens in src/app.py (LIQUID_GLASS_CSS)
# and src/review_components.py.

[client]
toolbarMode = "minimal"              # hide the developer "Deploy" toolbar

[server]
# The project lives on an NTFS drive mounted via FUSE, which doesn't deliver
# inotify events reliably — poll so edits to src/*.py modules are reloaded.
fileWatcherType = "poll"

[theme]
base = "dark"
primaryColor = "#EDEDED"             # white primary actions (monochrome UI)
backgroundColor = "#262626"          # page — requested base
secondaryBackgroundColor = "#2B2B2B" # surfaces
codeBackgroundColor = "#212121"
textColor = "#EDEDED"
linkColor = "#8FB3E8"
borderColor = "#363636"
codeTextColor = "#D4D4D4"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "9px"
buttonRadius = "9px"

# Typography — Geist (Vercel's typeface) for a crisp product-UI feel
font = "'Geist':https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
headingFont = "'Geist':https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "12.5px"
headingFontSizes = ["28px", "20px", "16px", "15px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colours — desaturated for long review sessions
greenColor = "#6BC495"   # Grounded / Approved
redColor = "#E2826F"     # Ungrounded / Rejected
yellowColor = "#D9AE5B"  # Partial / Pending
orangeColor = "#D9AE5B"
blueColor = "#8FB3E8"    # Informational / reviewer changes
violetColor = "#B4A7E6"
grayColor = "#8A8A8A"

chartCategoricalColors = ["#8FB3E8", "#6BC495", "#D9AE5B", "#E2826F", "#B4A7E6", "#7CC7C0", "#A3A3A3", "#D99BB8"]
chartSequentialColors = ["#1F2A38", "#26374C", "#2E4561", "#375577", "#43678F", "#5479A6", "#6A8EBD", "#8FB3E8", "#B5CDF0", "#DAE6F7"]

dataframeBorderColor = "#363636"
dataframeHeaderBackgroundColor = "#2B2B2B"

[theme.sidebar]
backgroundColor = "#262626"
secondaryBackgroundColor = "#2B2B2B"
codeBackgroundColor = "#212121"
textColor = "#EDEDED"
borderColor = "#363636"
primaryColor = "#EDEDED"
